name: Aktualizace karet z Piltover Archive

# Každý den ráno stáhne z Piltover Archive karty setů, které v Riftcodexu chybějí
# (např. Radiance), a uloží je do souboru piltover.json vedle aplikace.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stáhnout karty
        run: |
          cat > /tmp/stahni.mjs <<'EOF'
          import fs from 'node:fs';
          const B = 'https://piltoverarchive.com/api/external/v1';
          // Sety, které dodává Riftcodex. Tyhle se z Piltover Archive NEberou, aby se karty nezdvojily
          // a aby se neměnila ID karet v uložených kolekcích.
          const RC_SETS = new Set(['OGN','OGS','SFD','UNL','VEN','PR','JDG','OPP']);
          const MIN_DATE = '2026-08-01';
          const wait = ms => new Promise(r => setTimeout(r, ms));
          async function get(url){
            for(let i = 0; i < 4; i++){
              try{
                const r = await fetch(url, {headers:{Accept:'application/json','User-Agent':'riftbound-kolekce (GitHub Pages)'}});
                if(r.ok) return r.json();
                console.log('HTTP', r.status, url);
              }catch(e){ console.log('Chyba', e.message, url); }
              await wait(3000 * (i + 1));
            }
            throw new Error('Nepodařilo se stáhnout ' + url);
          }
          const sets = (await get(B + '/sets')).data || [];
          const keep = sets.filter(s => s.prefix && !RC_SETS.has(s.prefix) && !/-NN$/.test(s.prefix) && (s.releaseDate || '') >= MIN_DATE);
          const raw = [];
          for(const s of keep){
            let p = 1, tp = 1;
            do{
              const j = await get(`${B}/cards?limit=100&page=${p}&sets=${encodeURIComponent(s.prefix)}`);
              for(const v of j.data || []) if(v.set?.prefix === s.prefix && v.isCollectible !== false && v.showInLibrary !== false) raw.push(v);
              tp = j.pagination?.totalPages || 1; p++;
              await wait(300);
            }while(p <= tp);
          }
          // Tokeny (Gold, Buff, Shadow Clone, Tentacle…) ze všech setů – Riftcodex jich má jen pár
          {
            const have = new Set(raw.map(v => v.id));
            let p = 1, tp = 1;
            do{
              const j = await get(`${B}/cards?limit=100&page=${p}&supertypes=Token`);
              for(const v of j.data || []){
                if(v.card?.super !== 'Token' || !v.set?.prefix || /-NN$/.test(v.set.prefix) || have.has(v.id)) continue;
                raw.push(v); have.add(v.id);
              }
              tp = j.pagination?.totalPages || 1; p++;
              await wait(300);
            }while(p <= tp);
          }
          const noCost = ['Legend','Battlefield','Rune'];
          const cards = raw.map(v => {
            const c = v.card || {}, t = v.variantType || 'Standard', type = c.type || 'Jiné', unit = /Unit/.test(type);
            return {
              id: 'pa:' + v.id,
              name: t === 'Standard' ? c.name : `${c.name} (${v.variantLabel || t})`,
              rid: v.variantNumber || '',
              num: parseInt(String(v.variantNumber || '').split('-').pop(), 10) || 0,
              set: v.set.prefix, setLabel: v.set.name, setDate: (v.set.releaseDate || '').slice(0, 10),
              type, sup: c.super || '', rar: v.rarity || '',
              dom: (c.colors || []).map(x => x.name),
              e: noCost.includes(type) ? null : (c.energy ?? null),
              m: unit ? (c.might ?? null) : (c.might || null),
              p: c.power || null,
              text: c.description || '', fl: v.flavorText || '',
              img: v.imageUrl || '', art: v.artist || '', tags: c.tags || [],
              land: type === 'Battlefield',
              alt: t === 'Alt Art' || t === 'Promo', over: /Overnumbered/.test(t), sig: /Signed/.test(t)
            };
          }).sort((a, b) => a.set.localeCompare(b.set) || a.num - b.num || a.rid.localeCompare(b.rid));
          const setsOut = keep.map(s => ({id: s.prefix, label: s.name, date: (s.releaseDate || '').slice(0, 10)}));
          let old = null;
          try{ old = JSON.parse(fs.readFileSync('piltover.json', 'utf8')); }catch(e){}
          if(old && JSON.stringify(old.cards) === JSON.stringify(cards) && JSON.stringify(old.sets) === JSON.stringify(setsOut)){
            console.log('Beze změny:', cards.length, 'karet'); process.exit(0);
          }
          fs.writeFileSync('piltover.json', JSON.stringify({source:'piltoverarchive.com', generated:new Date().toISOString(), sets:setsOut, cards}));
          console.log('Uloženo:', cards.length, 'karet ze setů', setsOut.map(s => s.id).join(', '), '+ tokeny:', cards.filter(c => c.sup === 'Token').length);
          EOF
          node /tmp/stahni.mjs

      - name: Uložit do repozitáře
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- piltover.json && git ls-files --error-unmatch piltover.json >/dev/null 2>&1; then
            echo "Nic nového."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piltover.json
          git commit -m "Aktualizace karet z Piltover Archive"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages se aktualizují samy."
