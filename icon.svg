<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#26315a"/>
      <stop offset="1" stop-color="#0c1020"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6f78"/>
      <stop offset="1" stop-color="#0d2c44"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3355"/>
      <stop offset="1" stop-color="#171c33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58a"/>
      <stop offset="1" stop-color="#b08a2e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- zadní karta -->
  <g transform="rotate(-14 256 270)">
    <rect x="150" y="118" width="196" height="276" rx="20" fill="url(#back)" stroke="url(#gold)" stroke-width="7"/>
  </g>
  <!-- přední karta -->
  <g transform="rotate(9 256 270)">
    <rect x="168" y="128" width="196" height="276" rx="20" fill="url(#front)" stroke="url(#gold)" stroke-width="8"/>
    <rect x="186" y="146" width="160" height="240" rx="12" fill="none" stroke="#f3d58a" stroke-opacity=".35" stroke-width="3"/>
  </g>
  <!-- trhlina (rift) -->
  <path d="M206 120 L262 214 L232 236 L300 330 L276 344 L318 412" fill="none" stroke="#7ff3ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M206 120 L262 214 L232 236 L300 330 L276 344 L318 412" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
